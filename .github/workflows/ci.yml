name: Python CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install offline test dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Check Python syntax
        run: python -m compileall -q main main_start.py tests/test_refactor.py
      - name: Run offline regression tests
        run: python -B tests/test_refactor.py
